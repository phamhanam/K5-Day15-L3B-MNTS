# CP4: mô phỏng chi phí thực tế, đo token bằng workflow đang chạy.
# Nguồn tần suất: spec.md §2; khảo sát n=20 ở evidence/summary.md hỗ trợ nhu cầu kiểm lại hướng dẫn,
# chưa đo cơ cấu persona hay số lượt chat. Các giả định quy mô và cơ cấu được ghi rõ.
sessions: 50
seed: 42

users:
  low: 100
  base: 500
  high: 1000
  source: "(tự ước tính) quy mô người dùng hoạt động/tháng của pilot B2: nhỏ, cơ sở, mở rộng"

personas:
  - name: dung_it
    share: 0.3
    uses_per_month: 0.5
    turns_per_session: 1
    source: "Người trẻ khỏe; spec.md §2: 0,2–0,5 phiên/tháng; chọn 0,5, tỷ trọng và số lượt hỏi (tự ước tính)"
  - name: dung_vua
    share: 0.3
    uses_per_month: 1.5
    turns_per_session: 2
    source: "Phụ huynh có con nhỏ; spec.md §2: 1–2 phiên/tháng; chọn 1,5, tỷ trọng và số lượt hỏi (tự ước tính)"
  - name: dung_nhieu
    share: 0.4
    uses_per_month: 6
    turns_per_session: 2
    source: "Người con sắp thuốc cho cha mẹ bệnh mạn tính; spec.md §2: 4–8 phiên/tháng; chọn 6, tỷ trọng và số lượt hỏi (tự ước tính)"

# Giá standard trả phí cho văn bản, USD/1 triệu token; dùng để dự báo, không phải giá của OpenRouter free.
prices:
  - model: gemini-3.5-flash-lite
    input: 0.30
    output: 2.50
    source: "https://ai.google.dev/gemini-api/docs/pricing#gemini-3.5-flash-lite (xem 28/11/2026)"
  - model: gemini-3.1-pro-preview
    input: 2.00
    output: 12.00
    source: "https://ai.google.dev/gemini-api/docs/pricing#gemini-3.1-pro-preview (prompt ≤200k token, xem 28/11/2026)"

usd_to_vnd:
  rate: 26000
  source: "(tự ước tính) tỷ giá dùng cho kịch bản lập kế hoạch, không phải tỷ giá giao dịch"

# Chi phí nhân công chuyển dược sĩ được tính riêng trong cost-estimate.md.
# Giả định 20% phiên cần chuyển, 5 phút/phiên chuyển, 100.000 VND/giờ (tự ước tính).
